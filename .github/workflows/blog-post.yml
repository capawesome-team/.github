name: Blog Posts

on:
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: "Update this repo's README with latest blog posts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Pull in capawesome.io posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1.9.7
        with:
          feed_list: "https://capawesome.io/feed_rss_created.xml"
          readme_path: "./profile/README.md"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
          committer_username: "github-actions[bot]"
          commit_message: Update blog posts
